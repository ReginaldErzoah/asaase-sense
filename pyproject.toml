[project]
name = "asaase-sense"
version = "0.1.0"
description = "An environmental data intelligence platform for reliable environmental monitoring and analysis."
readme = "README.md"
authors = [
    { name = "Reginald Erzoah", email = "reginalderzoah10@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
asaase-sense = "asaase_sense:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
